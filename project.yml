name: Flotilla
options:
  bundleIdPrefix: com.niclassslua
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  DesignSystem:
    path: Packages/DesignSystem
  SessionKit:
    path: Packages/SessionKit
  ProcessKit:
    path: Packages/ProcessKit
  GitKit:
    path: Packages/GitKit
  AgentKit:
    path: Packages/AgentKit
  HooksKit:
    path: Packages/HooksKit
  TerminalKit:
    path: Packages/TerminalKit
  PersistenceKit:
    path: Packages/PersistenceKit
  SettingsKit:
    path: Packages/SettingsKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Flotilla:
    type: application
    platform: macOS
    sources:
      - path: Flotilla
      - path: Flotilla.icon
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      ENABLE_PREVIEWS: YES
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla
    dependencies:
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit

  FlotillaUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FlotillaUnitTests
    dependencies:
      - target: Flotilla
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
    settings:
      ENABLE_HARDENED_RUNTIME: NO

  FlotillaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FlotillaUITests
    dependencies:
      - target: Flotilla
    settings:
      ENABLE_HARDENED_RUNTIME: NO

schemes:
  Flotilla:
    build:
      targets:
        Flotilla: all
        FlotillaUnitTests: [test]
        FlotillaUITests: [test]
    test:
      targets:
        - FlotillaUnitTests
        - FlotillaUITests
