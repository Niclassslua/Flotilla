name: Flotilla
options:
  bundleIdPrefix: com.niclassslua
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Ephemeral: debug
  Release: release

packages:
  DesignSystem:
    path: Packages/DesignSystem
  SessionKit:
    path: Packages/SessionKit
  ProcessKit:
    path: Packages/ProcessKit
  GitKit:
    path: Packages/GitKit
  AgentKit:
    path: Packages/AgentKit
  HooksKit:
    path: Packages/HooksKit
  TerminalKit:
    path: Packages/TerminalKit
  PersistenceKit:
    path: Packages/PersistenceKit
  SettingsKit:
    path: Packages/SettingsKit
  TranscriptKit:
    path: Packages/TranscriptKit
  CompanionKit:
    path: Packages/CompanionKit
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0
  # Linked into the unit-test target only, so migration tests can drive a
  # DatabaseMigrator directly. Same requirement as PersistenceKit's own
  # Package.swift, so SPM resolves a single copy.
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Ephemeral:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOTILLA_EPHEMERAL"

targets:
  Flotilla:
    type: application
    platform: macOS
    sources:
      - path: Flotilla
      # `optional: true` lets CI move this directory out of the way before
      # `xcodegen generate` runs — actool on GitHub's Xcode 26.6 runners
      # crashes compiling this Icon Composer bundle. See AGENTS.md's CI/CD
      # section and .github/workflows/build.yml's "Use fallback app icon" step.
      - path: Flotilla.icon
        buildPhase: resources
        optional: true
    info:
      path: Flotilla/Info.plist
      properties:
        NSScreenCaptureUsageDescription: Flotilla allows coding agents to inspect screen and window previews.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla
      configs:
        Debug:
          # Screen Recording consent is tied to the signed code identity. Keep
          # Xcode-run builds on the developer's stable identity so consent
          # survives an ordinary rebuild.
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: UWAHVC4JTL
          # Its own identity, so a debug build launches next to the installed
          # app instead of activating it, and `killall "Flotilla Dev"` or a
          # quit by bundle ID never reaches the instance hosting the agents.
          PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.dev
          PRODUCT_NAME: Flotilla Dev
          PRODUCT_MODULE_NAME: Flotilla
          INFOPLIST_KEY_CFBundleDisplayName: Flotilla Dev
        Ephemeral:
          PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.ephemeral
          PRODUCT_NAME: Flotilla Ephemeral
          INFOPLIST_KEY_CFBundleDisplayName: Flotilla Ephemeral
    dependencies:
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
      - package: TranscriptKit
      - package: CompanionKit
      - package: Textual
        product: Textual

  FlotillaEphemeral:
    type: application
    platform: macOS
    sources:
      - path: Flotilla
      - path: FlotillaEphemeral.icon
        buildPhase: resources
    info:
      path: Flotilla/Info.plist
      properties:
        NSScreenCaptureUsageDescription: Flotilla allows coding agents to inspect screen and window previews.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.ephemeral
        PRODUCT_NAME: Flotilla Ephemeral
        INFOPLIST_KEY_CFBundleDisplayName: Flotilla Ephemeral
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: FlotillaEphemeral
      configs:
        Ephemeral:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOTILLA_EPHEMERAL"
    dependencies:
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
      - package: TranscriptKit
      - package: CompanionKit
      - package: Textual
        product: Textual

  # iOS companion. Demo mode uses simulated data; normal mode connects to
  # Flotilla on a Mac.
  FlotillaCompanion:
    type: application
    platform: iOS
    sources:
      - path: FlotillaCompanion
      - path: Flotilla.icon
        buildPhase: resources
        optional: true
    info:
      path: FlotillaCompanion/Info.plist
      properties:
        CFBundleDisplayName: Flotilla
        NSCameraUsageDescription: Flotilla uses the camera to scan the pairing code shown on your Mac.
        NSMicrophoneUsageDescription: Flotilla uses the microphone for dictation via Handy.
        NSLocalNetworkUsageDescription: Flotilla connects to your Mac on the local network to show and control your sessions.
        NSBonjourServices:
          - _flotilla-comp._tcp
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.niclassslua.flotilla.companion.pairing
            CFBundleURLSchemes:
              - flotilla
        # Local-only Live Activity — see docs/companion.md decision #6.
        NSSupportsLiveActivities: true
    configFiles:
      Debug: Config/CompanionSigning.xcconfig
      Ephemeral: Config/CompanionSigning.xcconfig
      Release: Config/CompanionSigning.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.companion
        PRODUCT_NAME: FlotillaCompanion
        INFOPLIST_KEY_CFBundleDisplayName: Flotilla
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla
    dependencies:
      - package: DesignSystem
      - package: SessionKit
      - package: TranscriptKit
      - package: CompanionKit
      - package: Textual
        product: Textual
      - target: FlotillaCompanionWidget

  # Dynamic Island / Lock Screen presentation of a Mac's fleet (Fleet Radar).
  # See FlotillaCompanion/LiveActivity/FleetActivityAttributes.swift.
  FlotillaCompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FlotillaCompanionWidget
      - path: FlotillaCompanion/LiveActivity/FleetActivityAttributes.swift
    info:
      path: FlotillaCompanionWidget/Info.plist
      properties:
        CFBundleDisplayName: Flotilla
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/CompanionSigning.xcconfig
      Ephemeral: Config/CompanionSigning.xcconfig
      Release: Config/CompanionSigning.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.companion.widget
        PRODUCT_NAME: FlotillaCompanionWidget
        INFOPLIST_KEY_CFBundleDisplayName: Flotilla
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: DesignSystem
      - package: SessionKit

  FlotillaCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlotillaCompanionTests
    dependencies:
      - target: FlotillaCompanion
      - package: CompanionKit
      - package: SessionKit
    configFiles:
      Debug: Config/CompanionSigning.xcconfig
      Ephemeral: Config/CompanionSigning.xcconfig
      Release: Config/CompanionSigning.xcconfig
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlotillaCompanion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlotillaCompanion"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FlotillaUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FlotillaUnitTests
    dependencies:
      - target: Flotilla
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
      - package: TranscriptKit
      - package: CompanionKit
      - package: GRDB.swift
        product: GRDB
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: UWAHVC4JTL
          # XcodeGen derives the host path from the base product name.
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Flotilla Dev.app/Contents/MacOS/Flotilla Dev"

  FlotillaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FlotillaUITests
      - path: Flotilla/App/AXID.swift
    dependencies:
      - target: Flotilla
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: UWAHVC4JTL

schemes:
  Flotilla:
    build:
      targets:
        Flotilla: all
        FlotillaUnitTests: [test]
        FlotillaUITests: [test]
    test:
      targets:
        - name: FlotillaUnitTests
          environmentVariables:
            UI_TESTING: "1"
        - FlotillaUITests

  FlotillaCompanion:
    build:
      targets:
        FlotillaCompanion: all
        FlotillaCompanionTests: [test]
    run:
      config: Debug
    test:
      targets:
        - FlotillaCompanionTests

  # The companion on its fixture fleet — for UI work without a Mac.
  FlotillaCompanion Demo:
    build:
      targets:
        FlotillaCompanion: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": true

  Flotilla Ephemeral:
    build:
      targets:
        FlotillaEphemeral: all
    run:
      config: Ephemeral
    profile:
      config: Ephemeral
    analyze:
      config: Ephemeral
    archive:
      config: Ephemeral

  UI Vocabulary Screenshots:
    build:
      targets:
        Flotilla: all
        FlotillaUITests: [test]
    test:
      targets:
        - name: FlotillaUITests
          parallelizable: false
          selectedTests:
            - VocabularyScreenshotUITests
      postActions:
        - name: Publish UI vocabulary screenshots
          settingsTarget: Flotilla
          script: |
            /bin/bash "$SRCROOT/Scripts/update-ui-vocabulary-screenshots.sh"
