name: Flotilla
options:
  bundleIdPrefix: com.niclassslua
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Ephemeral: debug
  Release: release

packages:
  DesignSystem:
    path: Packages/DesignSystem
  SessionKit:
    path: Packages/SessionKit
  ProcessKit:
    path: Packages/ProcessKit
  GitKit:
    path: Packages/GitKit
  AgentKit:
    path: Packages/AgentKit
  HooksKit:
    path: Packages/HooksKit
  TerminalKit:
    path: Packages/TerminalKit
  PersistenceKit:
    path: Packages/PersistenceKit
  SettingsKit:
    path: Packages/SettingsKit
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Ephemeral:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOTILLA_EPHEMERAL"

targets:
  Flotilla:
    type: application
    platform: macOS
    sources:
      - path: Flotilla
      - path: Flotilla.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla
      configs:
        Ephemeral:
          PRODUCT_BUNDLE_IDENTIFIER: com.niclassslua.flotilla.ephemeral
          PRODUCT_NAME: Flotilla Ephemeral
          INFOPLIST_KEY_CFBundleDisplayName: Flotilla Ephemeral
    dependencies:
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
      - package: Textual
        product: Textual

  FlotillaUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FlotillaUnitTests
    dependencies:
      - target: Flotilla
      - package: DesignSystem
      - package: SessionKit
      - package: ProcessKit
      - package: GitKit
      - package: AgentKit
      - package: HooksKit
      - package: TerminalKit
      - package: PersistenceKit
      - package: SettingsKit
    settings:
      ENABLE_HARDENED_RUNTIME: NO

  FlotillaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FlotillaUITests
    dependencies:
      - target: Flotilla
    settings:
      ENABLE_HARDENED_RUNTIME: NO

schemes:
  Flotilla:
    build:
      targets:
        Flotilla: all
        FlotillaUnitTests: [test]
        FlotillaUITests: [test]
    test:
      targets:
        - name: FlotillaUnitTests
          environmentVariables:
            UI_TESTING: "1"
        - FlotillaUITests

  Flotilla Ephemeral:
    build:
      targets:
        Flotilla: all
    run:
      config: Ephemeral
    profile:
      config: Ephemeral
    analyze:
      config: Ephemeral
    archive:
      config: Ephemeral

  UI Vocabulary Screenshots:
    build:
      targets:
        Flotilla: all
        FlotillaUITests: [test]
    test:
      targets:
        - name: FlotillaUITests
          parallelizable: false
          selectedTests:
            - VocabularyScreenshotUITests
      postActions:
        - name: Publish UI vocabulary screenshots
          settingsTarget: Flotilla
          script: |
            /bin/bash "$SRCROOT/Scripts/update-ui-vocabulary-screenshots.sh"
