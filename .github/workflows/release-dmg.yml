name: Release DMG

# Builds Flotilla.app, wraps it in a .dmg, and attaches that DMG to the
# GitHub Release that triggered the run. Cut a release (tag + publish) to
# produce Flotilla-<version>.dmg.
#
# Developer ID signed when DEVELOPER_ID_CERTIFICATE_P12 is configured, and
# notarized + stapled when NOTARY_API_KEY is too (AGENTS.md, CI/CD).
# Without them the DMG holds the ad-hoc archive and Gatekeeper warns.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    # Secrets live in the protected `release` environment: the job waits for
    # the maintainer's approval and only runs for v* tags.
    environment: release
    runs-on: macos-26
    timeout-minutes: 45

    # The `secrets` context isn't allowed in a step's `if:` condition, so
    # resolve it into a plain env var here that the steps below can branch on.
    env:
      HAS_DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # See build.yml — actool on GitHub's Xcode 26.6 runners crashes on
      # Flotilla.icon; use the plain fallback appiconset instead.
      - name: Use fallback app icon for CI
        run: |
          mv Flotilla.icon Flotilla.icon.disabled-for-ci
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla$/ASSETCATALOG_COMPILER_APPICON_NAME: FlotillaFallback/' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application" || {
            echo "::error::The .p12 holds no \"Developer ID Application\" identity:"
            security find-identity -p codesigning "$KEYCHAIN_PATH"
            exit 1
          }

      - name: Archive
        run: |
          if [ "$HAS_DEVELOPER_ID_CERT" = true ]; then
            make archive DEVELOPER_ID=1
          else
            make archive
            echo "::notice::No DEVELOPER_ID_CERTIFICATE_P12 secret configured — packaging an ad-hoc-signed, unnotarized build. See AGENTS.md's CI/CD section."
          fi
          mkdir -p build/Export
          ditto build/Flotilla.xcarchive/Products/Applications/Flotilla.app build/Export/Flotilla.app

      - name: Create DMG
        id: dmg
        run: |
          # Tag refs are typically v0.1.0; strip a leading v for the filename.
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION="${RAW_TAG#v}"
          STAGE="build/dmg-stage"
          DMG="build/Flotilla-${VERSION}.dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto build/Export/Flotilla.app "$STAGE/Flotilla.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "Flotilla" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG"

          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      # Notarizing the DMG covers the app inside it; stapling lets Gatekeeper
      # verify it offline.
      - name: Sign, notarize and staple DMG
        if: env.HAS_DEVELOPER_ID_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          DMG="${{ steps.dmg.outputs.path }}"
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          printf '%s' "$NOTARY_API_KEY" > "$KEY_PATH"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-DMG
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 90
