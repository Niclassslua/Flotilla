name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run UI tests
        run: make test-ui

      - name: Build (Release)
        run: make build-release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-Debug
          path: build/DerivedData/Build/Products/Debug/Flotilla.app
          retention-days: 7

  archive:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: make archive

      - name: Export (Developer ID)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Flotilla.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-Release
          path: build/Export/Flotilla.app
          retention-days: 30