name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Flotilla.icon is an Icon Composer bundle (specular/refractivity
      # features); actool on GitHub's Xcode 26.6 runners crashes compiling it
      # (works fine locally on Xcode 27). Move it out of the way — both
      # targets that reference it mark that source `optional: true` — and
      # point the macOS app at the plain FlotillaFallback.appiconset instead,
      # so CI validates a real build without needing Xcode 27.
      - name: Use fallback app icon for CI
        run: |
          mv Flotilla.icon Flotilla.icon.disabled-for-ci
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla$/ASSETCATALOG_COMPILER_APPICON_NAME: FlotillaFallback/' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run package tests
        run: make test-packages

      # Release only: it's what ships, and Xcode compiles Debug on every Run.
      - name: Build (Release)
        run: make build-release
