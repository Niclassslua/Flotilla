name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60

    # Debug signs with the maintainer's team (project.yml), which a runner
    # doesn't have; the test bundles build ad-hoc instead.
    env:
      SIGNING_OVERRIDE: CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real-pipeline tests drive /opt/homebrew/bin/tmux.
      - name: Install XcodeGen and tmux
        run: brew install xcodegen tmux

      # SwiftTerm compiles a Metal shader; the xcode-27 image ships without
      # the Metal toolchain component.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run package tests
        run: make test-packages

      # Release only: it's what ships, and Xcode compiles Debug on every Run.
      - name: Build (Release)
        run: make build-release

      - name: Run app unit tests
        # A hung test fails after 2 minutes instead of eating the job timeout.
        run: >
          make test SIGNING_OVERRIDE="$SIGNING_OVERRIDE"
          TEST_FLAGS="-test-timeouts-enabled YES -maximum-test-execution-time-allowance 120"

      # The log only names failing tests; messages, attachments and test-host
      # crash reports live in the result bundles.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/DerivedData/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/Flotilla*
          retention-days: 7

  # Parallel to `build`, so UI tests don't lengthen a run. A fresh runner, too:
  # nothing has launched the app at a smaller display size first.
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      SIGNING_OVERRIDE: CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen, tmux and displayplacer
        run: brew install xcodegen tmux displayplacer

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # The runner boots at 1024x768, narrower than the main window's
      # minimum width, which leaves the toolbar and sidebars off-screen.
      - name: Use a 1920x1080 display
        run: |
          id=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          displayplacer "id:$id res:1920x1080"
          displayplacer list | grep -m1 '^Resolution:'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run UI tests
        run: >
          make test-ui SIGNING_OVERRIDE="$SIGNING_OVERRIDE"
          TEST_FLAGS="-test-timeouts-enabled YES -maximum-test-execution-time-allowance 180"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            build/DerivedData/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/Flotilla*
          retention-days: 7
