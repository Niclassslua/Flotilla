name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    # Debug signs with the maintainer's personal Apple Development team
    # (project.yml, "Screen Recording consent"), which doesn't exist on a CI
    # runner. Override to ad-hoc, unsigned-but-runnable, for every Debug build
    # here — see Makefile's SIGNING_OVERRIDE.
    env:
      SIGNING_OVERRIDE: CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Flotilla.icon is an Icon Composer bundle (specular/refractivity
      # features); actool on GitHub's Xcode 26.6 runners crashes compiling it
      # (works fine locally on Xcode 27). Move it out of the way — both
      # targets that reference it mark that source `optional: true` — and
      # point the macOS app at the plain FlotillaFallback.appiconset instead,
      # so CI validates a real build without needing Xcode 27.
      - name: Use fallback app icon for CI
        run: |
          mv Flotilla.icon Flotilla.icon.disabled-for-ci
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla$/ASSETCATALOG_COMPILER_APPICON_NAME: FlotillaFallback/' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: make build SIGNING_OVERRIDE="$SIGNING_OVERRIDE"

      - name: Run package tests
        run: make test-packages

      - name: Build (Release)
        run: make build-release

      - name: Build (Ephemeral)
        run: make build-ephemeral

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-Debug
          path: build/DerivedData/Build/Products/Debug/Flotilla.app
          retention-days: 7

      - name: Upload ephemeral app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-Ephemeral
          path: build/DerivedData/Build/Products/Ephemeral/Flotilla Ephemeral.app
          retention-days: 7

  archive:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30

    # The `secrets` context isn't allowed in a step's `if:` condition, so
    # resolve it into a plain env var here that the steps below can branch on.
    env:
      HAS_DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # See the `build` job's "Use fallback app icon for CI" step — `make
      # archive` hits the same actool crash on Flotilla.icon otherwise.
      - name: Use fallback app icon for CI
        run: |
          mv Flotilla.icon Flotilla.icon.disabled-for-ci
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME: Flotilla$/ASSETCATALOG_COMPILER_APPICON_NAME: FlotillaFallback/' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: make archive

      # `make archive` itself is ad-hoc (project.yml's Release config has no
      # team), so the archive always succeeds. Exporting it with a real
      # Developer ID identity additionally needs a certificate — only attempt
      # that when one has been configured as a secret; otherwise ship the
      # already ad-hoc-signed .app straight out of the archive so this job
      # still produces something installable.
      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Export (Developer ID)
        if: env.HAS_DEVELOPER_ID_CERT == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Flotilla.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Package ad-hoc build (no Developer ID certificate configured)
        if: env.HAS_DEVELOPER_ID_CERT != 'true'
        run: |
          mkdir -p build/Export
          ditto build/Flotilla.xcarchive/Products/Applications/Flotilla.app build/Export/Flotilla.app
          echo "::notice::No DEVELOPER_ID_CERTIFICATE_P12 secret configured — uploaded the ad-hoc-signed build instead of a Developer ID export. See AGENTS.md's CI/CD section to add real Developer ID signing."

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flotilla-Release
          path: build/Export/Flotilla.app
          retention-days: 30
